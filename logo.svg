<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="88" y="48" rx="16" ry="16" width="74" height="148" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="93" y="62" rx="8" ry="8" width="64" height="110" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
  <!-- Screen glow (subtle) -->
  <rect x="93" y="62" rx="8" ry="8" width="64" height="110" fill="url(#grad1)" opacity="0.07"/>
  <!-- Camera dot -->
  <circle cx="125" cy="56" r="5.5" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <circle cx="125" cy="56" r="2" fill="#555"/>
  <!-- Home bar -->
  <rect x="111" y="175" rx="3" ry="3" width="28" height="5" fill="#333"/>

  <!-- Infinity arc — glowing -->
  <path d="M 26 125 C 58 58, 116 58, 125 125 C 134 192, 192 192, 224 125"
    stroke="url(#grad1)" stroke-width="11" fill="none"
    stroke-linecap="round" filter="url(#softglow)" opacity="0.95"/>

  <!-- Infinity arc — sharp overlay -->
  <path d="M 26 125 C 58 58, 116 58, 125 125 C 134 192, 192 192, 224 125"
    stroke="url(#grad1)" stroke-width="7" fill="none"
    stroke-linecap="round"/>
</svg>
